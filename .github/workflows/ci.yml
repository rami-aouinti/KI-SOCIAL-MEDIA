name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Install, QA and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install QA tools
        run: |
          composer require --dev --no-interaction --no-progress \
            squizlabs/php_codesniffer:^3.13 \
            phpstan/phpstan:^2.1 \
            larastan/larastan:^3.0 \
            rector/rector:^2.0

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Migrate database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Laravel Pint
        run: |
          vendor/bin/pint
          git diff --binary > /tmp/pint.patch

      - name: Upload Pint formatting patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pint-format-patch
          path: /tmp/pint.patch

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector dry-run
        run: vendor/bin/rector process --dry-run

      - name: PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test
