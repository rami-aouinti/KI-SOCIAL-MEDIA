services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy

    queue-worker:
        image: 'sail-8.4/app'
        restart: unless-stopped
        init: true
        command:
            - php
            - artisan
            - queue:work
            - database
            - --queue=default
            - --sleep=3
            - --tries=3
            - --timeout=60
            - --max-time=3600
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        stop_grace_period: 30s

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 10
            timeout: 5s
            interval: 5s

    adminer:
        image: 'adminer:latest'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${ADMINER_PORT:-8080}:8080'
        environment:
            ADMINER_DEFAULT_SERVER: mysql
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - sail

    n8n:
        image: '${N8N_IMAGE:-n8nio/n8n:2.48.4}'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${N8N_PORT:-5678}:5678'
        environment:
            N8N_ENCRYPTION_KEY: '${N8N_ENCRYPTION_KEY:?Generate N8N_ENCRYPTION_KEY in .env before starting n8n}'
            N8N_HOST: localhost
            N8N_PORT: 5678
            N8N_PROTOCOL: http
            N8N_EDITOR_BASE_URL: 'http://localhost:${N8N_PORT:-5678}/'
            WEBHOOK_URL: 'http://localhost:${N8N_PORT:-5678}/'
            N8N_SECURE_COOKIE: 'false'
            N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
            N8N_RUNNERS_ENABLED: 'true'
            N8N_DIAGNOSTICS_ENABLED: 'false'
            N8N_PERSONALIZATION_ENABLED: 'false'
            N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
            N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: 'true'
            GENERIC_TIMEZONE: '${APP_TIMEZONE:-Europe/Berlin}'
            TZ: '${APP_TIMEZONE:-Europe/Berlin}'
        volumes:
            - 'n8n-data:/home/node/.n8n'
        networks:
            - sail
        stop_grace_period: 30s

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
    n8n-data:
        driver: local
